_format_version: "3.0"

services:
  - name: user-service
    url: http://user-service.techstore.svc.cluster.local:8080
    routes:
      - name: public-routes
        paths:
          - /api/v1/users/register
          - /api/v1/auth/login
        strip_path: false
      - name: protected-routes
        paths:
          - /api/v1/users/me
        strip_path: false
        plugins:
          - name: jwt
            config:
              uri_param_names: []
              cookie_names: []
              header_names: ["Authorization"]
              claims_to_verify: ["exp"]
  - name: catalog-service
    url: http://catalog-service.techstore.svc.cluster.local:8080
    routes:
      - name: catalog-routes
        paths:
          - /api/v1/products
        strip_path: false
consumers:
  - username: user-service-client
    jwt_secrets:
      - key: "user-service-key"
        algorithm: RS256
        rsa_public_key: |

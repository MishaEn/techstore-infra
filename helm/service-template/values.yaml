replicaCount: 1

image:
  repository: ""          # Обязательно для заполнения, например: registry.example.com/techstore/user-service
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env: []                   # Формат: [{name: "DB_HOST", value: "postgres-postgresql.techstore.svc.cluster.local"}]

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
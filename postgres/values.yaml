# values.yaml — минимальная конфигурация для локальной разработки
auth:
  postgresPassword: "dev-postgres-admin"   # Пароль администратора PostgreSQL
  username: "techstore"                     # Бизнес-пользователь
  password: "dev-techstore-pass"

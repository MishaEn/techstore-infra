# cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: techstore
nodes:
  - role: control-plane
    extraPortMappings:
      # Порты для последующего Ingress (на данный момент не используются, зарезервированы)
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
